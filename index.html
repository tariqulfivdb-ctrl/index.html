<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The professional profile of Md Tariqul Islam, Admin & Finance.">
  <title>Md Tariqul Islam | Admin &amp; Finance</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172a35;
      --muted: #60717a;
      --paper: #f3f7f4;
      --white: #fff;
      --green: #147d68;
      --green-dark: #0d5d50;
      --line: #dfe7e2;
      --soft-green: #e6f2ed;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: system-ui, "Segoe UI", sans-serif;
      line-height: 1.7;
    }
    a { color: inherit; }
    .container { width: min(1080px, calc(100% - 40px)); margin-inline: auto; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      background: rgba(243, 247, 244, .94);
      border-bottom: 1px solid rgba(223, 231, 226, .85);
      backdrop-filter: blur(12px);
    }
    .nav {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .brand { text-decoration: none; font-size: 1.08rem; font-weight: 800; letter-spacing: -.02em; }
    .brand span { color: var(--green); }
    .nav-links { display: flex; align-items: center; gap: 10px; padding: 0; margin: 0; list-style: none; }
    .nav-links a {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      padding: 7px 12px;
      border: 1px solid var(--green);
      border-radius: 8px;
      background: var(--green);
      color: var(--white);
      font-size: .9rem;
      font-weight: 700;
      text-decoration: none;
      transition: background .18s ease, transform .18s ease;
    }
    .nav-links a:hover { background: var(--green-dark); transform: translateY(-1px); }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 9px 18px;
      border: 1px solid var(--green);
      border-radius: 8px;
      background: var(--green);
      color: var(--white);
      font-weight: 700;
      text-decoration: none;
      transition: background .18s ease, transform .18s ease;
    }
    .button:hover { background: var(--green-dark); transform: translateY(-1px); }
    .hero {
      position: relative;
      overflow: hidden;
      padding: 74px 0;
      background:
        radial-gradient(ellipse at 85% 12%, rgba(20, 125, 104, .12), transparent 30%),
        linear-gradient(135deg, #f3f7f4 0%, #eaf3ee 100%);
    }
    .hero::after {
      position: absolute;
      right: -130px;
      bottom: -260px;
      width: 480px;
      height: 480px;
      border: 1px solid rgba(20, 125, 104, .14);
      border-radius: 50%;
      content: "";
      box-shadow: 0 0 0 38px rgba(20, 125, 104, .035), 0 0 0 78px rgba(20, 125, 104, .025);
      pointer-events: none;
    }
    .profile-card {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(250px, .82fr) 1.18fr;
      align-items: center;
      gap: clamp(32px, 7vw, 78px);
      max-width: 940px;
      margin-inline: auto;
      padding: clamp(20px, 4vw, 42px);
      border: 1px solid rgba(223, 231, 226, .9);
      border-radius: 22px;
      background: rgba(255, 255, 255, .82);
      box-shadow: 0 24px 70px rgba(23, 42, 53, .09);
    }
    .profile-photo {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      object-position: center 38%;
      border: 8px solid var(--white);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(23, 42, 53, .14);
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 16px;
      color: var(--green-dark);
      font-size: .82rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .eyebrow::before { width: 24px; height: 2px; background: var(--green); content: ""; }
    h1, h2, h3, p { margin-top: 0; }
    h1 {
      margin-bottom: 12px;
      font-size: clamp(2.25rem, 5vw, 3.8rem);
      line-height: 1.08;
      letter-spacing: -.05em;
    }
    h1 span { color: var(--green); }
    .role { margin-bottom: 18px; color: var(--green-dark); font-size: 1.02rem; font-weight: 800; letter-spacing: .14em; }
    .hero-copy { max-width: 490px; margin-bottom: 24px; color: var(--muted); }
    .profile-tags { display: flex; flex-wrap: wrap; gap: 9px; margin: 0; padding: 0; list-style: none; }
    .profile-tags li { padding: 6px 11px; border: 1px solid var(--line); border-radius: 999px; background: var(--white); color: #42575f; font-size: .82rem; font-weight: 650; }
    section { padding: 70px 0; scroll-margin-top: 76px; }
    .section-heading { max-width: 660px; margin-bottom: 28px; }
    .section-heading .eyebrow { margin-bottom: 9px; }
    h2 { margin-bottom: 10px; font-size: clamp(1.8rem, 4vw, 2.5rem); line-height: 1.2; letter-spacing: -.035em; }
    .section-heading p, .about-copy { color: var(--muted); }
    .about-grid { display: grid; grid-template-columns: .85fr 1.15fr; align-items: start; gap: 48px; }
    .about-copy { margin: 0 0 20px; font-size: 1.02rem; }
    .values { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
    .value { padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--white); font-weight: 700; }
    .value span { display: block; margin-bottom: 3px; color: var(--green); font-size: .8rem; letter-spacing: .08em; }
    .expertise { background: var(--white); }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .card { padding: 22px; border: 1px solid var(--line); border-radius: 12px; background: var(--white); box-shadow: 0 8px 24px rgba(23, 42, 53, .035); }
    .card-icon { display: grid; width: 40px; height: 40px; margin-bottom: 14px; place-items: center; border-radius: 10px; background: var(--soft-green); color: var(--green-dark); font-size: .85rem; font-weight: 800; }
    .card h3 { margin-bottom: 6px; font-size: 1.05rem; }
    .card p { margin: 0; color: var(--muted); font-size: .92rem; }
    .career-list { display: grid; gap: 16px; max-width: 850px; }
    .career-entry { display: grid; grid-template-columns: 175px 1fr; gap: 24px; padding: 24px; border: 1px solid var(--line); border-radius: 12px; background: var(--white); }
    .career-dates { color: var(--green-dark); font-size: .9rem; font-weight: 750; }
    .career-entry h3 { margin-bottom: 4px; font-size: 1.12rem; }
    .career-entry p { margin-bottom: 0; color: var(--muted); }
    .details-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .detail-card { padding: 24px; border: 1px solid var(--line); border-radius: 12px; background: var(--white); }
    .detail-card h3 { margin-bottom: 8px; font-size: 1.08rem; }
    .detail-card p { margin: 0; color: var(--muted); }
    .detail-card .detail-label { margin-bottom: 8px; color: var(--green-dark); font-size: .78rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .location-section { background: var(--white); }
    footer { padding: 23px 0; border-top: 1px solid var(--line); color: var(--muted); font-size: .9rem; }
    .footer-inner { display: flex; justify-content: space-between; gap: 16px; }
    footer p { margin: 0; }
    @media (max-width: 760px) {
      .container { width: min(100% - 32px, 600px); }
      .nav { min-height: 64px; }
      .nav-links { gap: 8px; }
      .nav-links li:nth-child(n+4) { display: none; }
      .hero { padding: 42px 0; }
      .profile-card { grid-template-columns: minmax(190px, .8fr) 1.2fr; gap: 24px; padding: 20px; }
      section { padding: 55px 0; }
      .about-grid { grid-template-columns: 1fr; gap: 12px; }
      .cards { grid-template-columns: 1fr 1fr; }
      .career-entry { grid-template-columns: 1fr; gap: 8px; }
    }
    @media (max-width: 520px) {
      .nav-links { gap: 6px; }
      .nav-links a { font-size: .8rem; }
      .nav-cta { display: none; }
      .profile-card { grid-template-columns: 1fr; gap: 22px; padding: 16px; }
      .profile-photo { max-height: 390px; aspect-ratio: 4 / 3; object-position: center 35%; }
      .profile-details { padding: 0 6px 8px; }
      .cards, .values { grid-template-columns: 1fr; }
      .details-grid { grid-template-columns: 1fr; }
      .footer-inner { flex-direction: column; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>

      el("nav", { class: "nav container", "aria-label": "Main navigation" },
        el("a", { class: "brand", href: "#home" }, "Tariqul", el("span", {}, ".")),
        el("ul", { class: "nav-links" }, ...site.nav.map(link =>
          el("li", {}, el("a", { href: link.href }, link.label))
        )),
        el("a", { class: "button nav-cta", href: "#experience" }, "View Experience")
      )
    );

    const heroSection = el("section", { class: "hero", id: "home" },
      el("div", { class: "container" },
        el("div", { class: "profile-card" },
          el("img", { class: "profile-photo", src: site.image.src, alt: site.image.alt }),
          el("div", { class: "profile-details" },
            el("p", { class: "eyebrow" }, "Professional Profile"),
            el("h1", {}, "Md Tariqul ", el("span", {}, "Islam")),
            el("p", { class: "role" }, site.role.toUpperCase()),
            el("p", { class: "hero-copy" }, "Admin & Finance professional at FIVDB, coordinating financial activities with cloud-based TallyPrime."),
            el("ul", { class: "profile-tags", "aria-label": "Professional strengths" },
              ...["Organized", "Accurate", "Dependable"].map(label => el("li", {}, label))
            )
          )
        )
      )
    );

    const aboutSection = el("section", { id: "about" },
      el("div", { class: "container about-grid" },
        el("div", { class: "section-heading" },
          el("p", { class: "eyebrow" }, "About"),
          el("h2", {}, "Careful with details. Committed to getting things done.")
        ),
        el("div", {},
          el("p", { class: "about-copy" }, site.about),
          el("div", { class: "values", "aria-label": "Core values" },
            ...site.values.map((value, index) =>
              el("div", { class: "value" }, el("span", {}, `0${index + 1}`), value)
            )
          )
        )
      )
    );

    const experienceSection = el("section", { id: "experience" },
      el("div", { class: "container" },
        el("div", { class: "section-heading" },
          el("p", { class: "eyebrow" }, "Career History"),
          el("h2", {}, "Professional Experience"),
          el("p", {}, "A career focused on administration and finance.")
        ),
        el("div", { class: "career-list" },
          ...site.experience.map(item =>
            el("article", { class: "career-entry" },
              el("div", { class: "career-dates" }, item.dates),
              el("div", {},

                el("p", { class: "detail-label" }, item.position),
                el("p", {}, item.description)
              )

          )

      )
